[package]
name = "pi-subagents"
type = "code"
version = "0.20.0"
language = "typescript"

[build]
backend = "typescript"
gate = ["lint", "typing", "build", "test", "workbench-shell", "package-smoke"]

[build.commands]
lint = "npm run lint"
typing = "npm run typecheck"
test = "npm run test"
build = "npm run build"

[build.commands.workbench-shell]
command = "bash qa/workbench/smoke.sh"
timeout = 120

[build.commands.typecheck]
command = "npm run typecheck"

[build.commands.native-read]
command = "./node_modules/.bin/vitest run --config vitest.native.config.ts"
timeout = 180

[build.commands.rf-preview]
command = "./node_modules/.bin/vitest run --config vitest.rf.config.ts"
timeout = 180

[build.commands.furnace-observe]
command = "./node_modules/.bin/vitest run --config vitest.furnace.config.ts"
timeout = 180

[build.commands.furnace-hosted-live]
command = "./node_modules/.bin/vitest run --config vitest.furnace-hosted.config.ts"
timeout = 240

[build.commands.claude-live]
command = "./node_modules/.bin/vitest run --config vitest.claude-live.config.ts"
timeout = 210

[build.commands.package-smoke]
command = "bash qa/workbench/package-smoke.sh"
timeout = 120

[build.commands.install-smoke]
command = "node qa/workbench/install-smoke.mjs"
timeout = 240

[build.commands.e2e]
command = "npm run test:e2e"
timeout = 180

[build.commands.designer-client]
command = "node qa/workbench/designer-client.mjs"
timeout = 120

[build.commands.designer-unit]
command = "./node_modules/.bin/vitest run test/workbench-designer.test.ts"
timeout = 120

[build.commands.inspector-client]
command = "node qa/workbench/inspector-smoke.mjs"
timeout = 120

[build.commands.inspector-bench]
command = "node qa/workbench/inspector-bench.mjs"
timeout = 180

[build.commands.observation-recovery-bench]
command = "node qa/workbench/observation-recovery-bench.mjs"
timeout = 300

[build.commands.inspector-grouped-bench]
command = "node qa/workbench/inspector-grouped-bench.mjs"
timeout = 300

[build.commands.local-detached-shell]
command = "bash qa/workbench/local-detached.sh"
timeout = 180

[build.commands.local-detached-unit]
command = "./node_modules/.bin/vitest run test/workbench-local-detached.test.ts"
timeout = 180

[build.commands.inspector-smoke]
command = "node qa/workbench/inspector-smoke.mjs"
timeout = 120

[build.commands.furnace-active-observe]
command = "./node_modules/.bin/vitest run --config vitest.furnace-active.config.ts"
timeout = 180

[build.commands.status-ledger]
command = "node qa/workbench/status-ledger.mjs"
timeout = 60
