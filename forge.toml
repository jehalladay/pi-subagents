[package]
name = "pi-subagents"
type = "code"
version = "0.20.0"
language = "typescript"

[build]
backend = "typescript"
gate = ["lint", "typing", "build", "test", "census", "workbench-shell", "package-smoke"]

[build.commands]
lint = "npm run lint"
typing = "npm run typecheck && npm run typecheck:test"
test = "npm run test"
build = "npm run build"

[build.commands.workbench-shell]
command = "bash qa/workbench/smoke.sh"
timeout = 120

[build.commands.typecheck]
command = "npm run typecheck && npm run typecheck:test"

[build.commands.native-read]
command = "./node_modules/.bin/vitest run --config vitest.native.config.ts"
timeout = 180

[build.commands.rf-preview]
command = "./node_modules/.bin/vitest run --config vitest.rf.config.ts"
timeout = 180

[build.commands.furnace-observe]
command = "./node_modules/.bin/vitest run --config vitest.furnace.config.ts"
timeout = 180

[build.commands.furnace-hosted-retry-fault]
command = "node qa/workbench/furnace-hosted-retry-fault.mjs"
timeout = 120

[build.commands.furnace-hosted-live]
command = "./node_modules/.bin/vitest run --config vitest.furnace-hosted.config.ts"
timeout = 240

[build.commands.furnace-vc4-live]
command = "node qa/workbench/live-furnace-vc4.mjs"
timeout = 240

[build.commands.claude-live]
command = "./node_modules/.bin/vitest run --config vitest.claude-live.config.ts"
timeout = 210

[build.commands.claude-adverse-live]
command = "node qa/workbench/live-adverse.mjs"
timeout = 300

[build.commands.package-smoke]
command = "bash qa/workbench/package-smoke.sh"
timeout = 120

[build.commands.release-checklist]
command = "node qa/workbench/release-checklist-receipt.mjs"
timeout = 600

[build.commands.install-smoke]
command = "node qa/workbench/install-smoke.mjs"
timeout = 240

[build.commands.install-minimal]
command = "node qa/workbench/install-minimal.mjs"
timeout = 300

[build.commands.e2e]
command = "npm run test:e2e"
timeout = 180

[build.commands.designer-client]
command = "node qa/workbench/designer-client.mjs"
timeout = 120

[build.commands.designer-unit]
command = "./node_modules/.bin/vitest run test/workbench-designer.test.ts"
timeout = 120

[build.commands.inspector-client]
command = "node qa/workbench/inspector-smoke.mjs"
timeout = 120

[build.commands.inspector-bench]
command = "node qa/workbench/inspector-bench.mjs"
timeout = 180

[build.commands.tool-reply-bench]
command = "node qa/workbench/tool-reply-bench.mjs"
timeout = 600

[build.commands.observation-recovery-bench]
command = "node qa/workbench/observation-recovery-bench.mjs"
timeout = 300

[build.commands.inspector-grouped-bench]
command = "node qa/workbench/inspector-grouped-bench.mjs"
timeout = 300

[build.commands.topology-slice-grouped-bench]
command = "node qa/workbench/topology-slice-grouped-bench.mjs"
timeout = 300

[build.commands.reducer-selector-bench]
command = "node qa/workbench/reducer-selector-bench.mjs"
timeout = 300

[build.commands.inspector-cap-saturation-bench]
command = "node --expose-gc qa/workbench/inspector-cap-saturation-bench.mjs"
timeout = 600

[build.commands.line-diff-bench]
command = "node qa/workbench/line-diff-bench.mjs"
timeout = 300

[build.commands.inspector-evidence-retained-bench]
command = "node --expose-gc qa/workbench/inspector-evidence-retained-bench.mjs"
timeout = 300

[build.commands.local-detached-shell]
command = "bash qa/workbench/local-detached.sh"
timeout = 180

[build.commands.local-detached-faults]
command = "node qa/workbench/local-detached-faults.mjs"
timeout = 240

[build.commands.local-detached-shared-child]
command = "node qa/workbench/local-detached-shared-child.mjs"
timeout = 240

[build.commands.local-detached-unit]
command = "./node_modules/.bin/vitest run test/workbench-local-detached.test.ts"
timeout = 180

[build.commands.inspector-smoke]
command = "node qa/workbench/inspector-smoke.mjs"
timeout = 120

[build.commands.attention-grouped-bench]
command = "node qa/workbench/attention-grouped-bench.mjs"
timeout = 300

[build.commands.inspector-retained-memory-bench]
command = "node --expose-gc qa/workbench/inspector-retained-memory-bench.mjs"
timeout = 300

[build.commands.furnace-active-observe]
command = "./node_modules/.bin/vitest run --config vitest.furnace-active.config.ts"
timeout = 180

[build.commands.headless-host-census]
command = "node qa/workbench/headless-host-census.mjs"
timeout = 120

[build.commands.status-ledger]
command = "node qa/workbench/status-ledger.mjs"
timeout = 60

[build.commands.timeline-grouped-bench]
command = "node qa/workbench/timeline-grouped-bench.mjs"
timeout = 300

[build.commands.rf-preview-tsx]
command = "./node_modules/.bin/vitest run --config vitest.rf-tsx.config.ts"
timeout = 180

[build.commands.forge-control-live]
command = "./node_modules/.bin/vitest run --config vitest.forge-control-live.config.ts"
timeout = 600

[build.commands.furnace-control-live]
command = "./node_modules/.bin/vitest run --config vitest.furnace-control-live.config.ts"
timeout = 900

[build.commands.detached-control-live]
command = "./node_modules/.bin/vitest run --config vitest.detached-control-live.config.ts"
timeout = 600

[build.commands.claude-control-live]
command = "./node_modules/.bin/vitest run --config vitest.claude-control-live.config.ts"
timeout = 900

[build.commands.census]
command = "npm run test:census"
timeout = 300
after = ["test"]
consumes = ["test"]
